spring.application.name=chat-app
server.port=8080

# ---------- Database (MySQL) ----------
# Values come from environment variables, with local-dev fallbacks after the ':'.
# In production, set DB_URL / DB_USERNAME / DB_PASSWORD as real env vars and the
# fallbacks are never used - so no real credential needs to live in this file.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/chatdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- JWT ----------
# Same pattern: set JWT_SECRET as a real environment variable in any shared/prod
# environment. The fallback here is fine for solo local development only.
jwt.secret=${JWT_SECRET:ChangeThisSuperSecretKeyBeforeProdUse-MustBeAtLeast256BitsLong!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- Jackson ----------
spring.jackson.serialization.write-dates-as-timestamps=false